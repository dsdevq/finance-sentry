services:
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: finance-sentry-frontend
    restart: unless-stopped
    ports:
      - "4200:4200"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - finance-sentry-network
    volumes:
      - ../frontend:/app
      - /app/node_modules

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: finance-sentry-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5000
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=finance_sentry;Username=finance_user;Password=finance_password;"
      Plaid__BaseUrl: https://sandbox.plaid.com
      Plaid__ClientId: ${PLAID_CLIENT_ID}
      Plaid__Secret: ${PLAID_SECRET}
      Plaid__Environment: sandbox
      TrueLayer__AuthBaseUrl: https://auth.truelayer.com
      TrueLayer__ApiBaseUrl: https://api.truelayer.com
      TrueLayer__ClientId: ${TRUELAYER_CLIENT_ID:-}
      TrueLayer__ClientSecret: ${TRUELAYER_CLIENT_SECRET:-}
      TrueLayer__FrontendRedirectBase: http://localhost:4200
      TrueLayer__CallbackPath: /api/v1/accounts/truelayer/callback
      TrueLayer__Scopes: "info accounts balance transactions cards offline_access"
      Jwt__Secret: ${JWT_SECRET:-your-secret-key-change-in-production}
      Jwt__Issuer: "https://finance-sentry.local"
      Deduplication__MasterKeyBase64: dGVzdC1kZWR1cGxpY2F0aW9uLWtleS1jaGFuZ2UtaW4tcHJvZHVjdGlvbg==
      GOOGLEOAUTH__CLIENTID: "${GOOGLE_CLIENT_ID:-}"
      # Per-user IBeam orchestration
      IBeam__Image: "voyz/ibeam:latest"
      IBeam__Network: "docker_finance-sentry-network"
      IBeam__ConfHostPath: "${PWD}/ibkr/conf.yaml"
      IBeam__ContainerNamePrefix: "finance-sentry-ibkr"
      IBeam__SpawnTimeoutSeconds: "120"
      IBeam__DockerEndpoint: "unix:///var/run/docker.sock"
    ports:
      - "5001:5000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - finance-sentry-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./logs:/app/logs
      # Docker socket for per-user IBeam container orchestration
      - /var/run/docker.sock:/var/run/docker.sock

  mcp:
    build:
      context: ..
      dockerfile: docker/Dockerfile.mcp
    container_name: finance-sentry-mcp
    restart: unless-stopped
    stdin_open: true
    environment:
      MCP_TRANSPORT: ${MCP_TRANSPORT:-stdio}
      MCP_HTTP_PORT: ${MCP_HTTP_PORT:-5100}
      MCP_CONNECTION_STRING: ${MCP_CONNECTION_STRING:-Host=postgres;Port=5432;Database=finance_sentry;Username=finance_user;Password=finance_password}
      ConnectionStrings__Default: ${MCP_CONNECTION_STRING:-Host=postgres;Port=5432;Database=finance_sentry;Username=finance_user;Password=finance_password}
      Deduplication__MasterKeyBase64: dGVzdC1kZWR1cGxpY2F0aW9uLWtleS1jaGFuZ2UtaW4tcHJvZHVjdGlvbg==
      # MCP identity: long-lived JWT issued by POST /api/v1/auth/mcp-token. Without it,
      # tools require an explicit userId arg. With it, every tool defaults to the user
      # encoded in the token's sub claim.
      Jwt__Secret: ${JWT_SECRET:-your-secret-key-change-in-production}
      Mcp__Token: ${MCP_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - finance-sentry-network

  # Per-user IBeam gateway containers are spawned dynamically by the API via
  # Docker socket (mounted above). No shared single-tenant ibkr-gateway
  # service — connect via POST /api/v1/brokerage/ibkr/connect to spin one up.

  postgres:
    image: postgres:14-alpine
    container_name: finance-sentry-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: finance_user
      POSTGRES_PASSWORD: finance_password
      POSTGRES_DB: finance_sentry
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - finance-sentry-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance_user -d finance_sentry"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local

networks:
  finance-sentry-network:
    driver: bridge
