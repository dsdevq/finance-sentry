name: Weekly Release

# Cuts a release once a week by merging the Release Please PR that accumulates on main.
# Release Please keeps that PR current on every merge; this job just lands it on a cadence.
# No releasable commits since the last release → no PR → the job no-ops.
#
# GITHUB_TOKEN merges do not fire push-triggered workflows, so after merging this job
# explicitly dispatches Release Please (tags + publishes the GitHub release) and the VPS
# deploy (ships the bumped version manifest, e.g. the UI footer version).

on:
  schedule:
    - cron: "0 8 * * 1" # Mondays 08:00 UTC
  workflow_dispatch: # manual "release now"

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: weekly-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Merge pending release PR, then dispatch tag + deploy
        run: |
          set -euo pipefail
          pr=$(gh pr list --state open --label "autorelease: pending" --json number --jq '.[0].number // empty')
          if [[ -z "$pr" ]]; then
            echo "No pending release PR — nothing to release this week."
            exit 0
          fi

          # Release-please regenerates its branch with GITHUB_TOKEN pushes, which fire no
          # workflows — so the required checks (build-and-test, lint-build-test,
          # build-backend-image) never report on the head SHA and the merge would be
          # rejected. Dispatch them explicitly against the release branch and wait for
          # them to succeed on the head commit before merging.
          head_ref=$(gh pr view "$pr" --json headRefName --jq .headRefName)
          head_sha=$(gh pr view "$pr" --json headRefOid --jq .headRefOid)
          required_checks="build-and-test lint-build-test build-backend-image"

          passed_checks() {
            gh api "repos/$GH_REPO/commits/$head_sha/check-runs" --paginate \
              --jq '[.check_runs[] | select(.conclusion == "success") | .name] | unique | join(" ")'
          }

          missing=""
          for c in $required_checks; do
            case " $(passed_checks) " in *" $c "*) ;; *) missing="$missing $c" ;; esac
          done

          if [[ -n "$missing" ]]; then
            echo "Checks not yet green on $head_sha:$missing — dispatching CI on $head_ref"
            gh workflow run backend-ci.yml --ref "$head_ref"
            gh workflow run frontend-ci.yml --ref "$head_ref"
            gh workflow run docker-build.yml --ref "$head_ref"

            deadline=$(( $(date +%s) + 1500 ))  # 25 min
            while true; do
              # Abort if the branch moved under us (release-please regenerated mid-run).
              current_sha=$(gh pr view "$pr" --json headRefOid --jq .headRefOid)
              if [[ "$current_sha" != "$head_sha" ]]; then
                echo "Release branch moved ($head_sha -> $current_sha) mid-run; aborting — rerun the workflow." >&2
                exit 1
              fi
              failed=$(gh api "repos/$GH_REPO/commits/$head_sha/check-runs" --paginate \
                --jq '[.check_runs[] | select(.conclusion != null and .conclusion != "success" and .conclusion != "neutral" and .conclusion != "skipped") | .name] | unique | join(", ")')
              if [[ -n "$failed" ]]; then
                echo "Check(s) failed on the release branch: $failed — not merging." >&2
                exit 1
              fi
              ok=$(passed_checks)
              all_green=true
              for c in $required_checks; do
                case " $ok " in *" $c "*) ;; *) all_green=false ;; esac
              done
              $all_green && break
              if (( $(date +%s) > deadline )); then
                echo "Timed out waiting for required checks on $head_sha." >&2
                exit 1
              fi
              sleep 30
            done
            echo "All required checks green on $head_sha."
          else
            echo "Required checks already green on $head_sha."
          fi

          echo "Merging release PR #$pr"
          gh pr merge "$pr" --squash --delete-branch
          gh workflow run release-please.yml --ref main
          gh workflow run deploy.yml --ref main
