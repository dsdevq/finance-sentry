name: Release Please

on:
  push:
    branches: [main]
  # Dispatched by weekly-release.yml after it merges the release PR: a merge done with
  # GITHUB_TOKEN does not fire push workflows, so the tag/release step must be invoked
  # explicitly (workflow_dispatch is exempt from that restriction).
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          # A PAT (RELEASE_PLEASE_TOKEN, fine-grained: this repo, Contents + Pull requests
          # read/write) so pushes to the release branch trigger the CI workflows — GITHUB_TOKEN
          # pushes fire none, which leaves the release PR permanently blocked now that
          # build-and-test / lint-build-test / build-backend-image are required checks on main.
          # Falls back to GITHUB_TOKEN (old behavior) until the secret is set.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
