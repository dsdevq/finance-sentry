name: Release Please

on:
  push:
    branches: [main]
  # Dispatched by weekly-release.yml after it merges the release PR: a merge done with
  # GITHUB_TOKEN does not fire push workflows, so the tag/release step must be invoked
  # explicitly (workflow_dispatch is exempt from that restriction).
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          # GITHUB_TOKEN pushes fire no workflows, so the release PR's head never gets the
          # required checks on its own; weekly-release.yml dispatches them explicitly before
          # merging (#578 — deliberately no standing PAT). The expression below is a dormant
          # override: if a RELEASE_PLEASE_TOKEN secret ever exists it is used, otherwise
          # GITHUB_TOKEN, with no behavior change.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
