@if (!isHidden()) {
  <div class="fixed bottom-cmn-4 left-cmn-4 z-50 flex flex-col items-start gap-cmn-3">
    @if (isOpen()) {
      <section
        class="flex h-[min(560px,80vh)] w-[min(384px,calc(100vw-2rem))] flex-col overflow-hidden rounded-cmn-lg border border-border-default bg-surface-card shadow-2xl"
      >
        <header
          class="flex items-center justify-between gap-cmn-2 border-b border-border-default px-cmn-3 py-cmn-2"
        >
          <div class="flex items-center gap-cmn-2 text-text-primary">
            <cmn-icon [name]="openIcon" size="sm" />
            <span class="font-medium">Ledger</span>
          </div>
          <div class="flex items-center gap-cmn-1">
            <button
              (click)="onNewChat()"
              type="button"
              aria-label="New chat"
              class="rounded-cmn-md p-cmn-1 text-text-secondary hover:bg-surface-hover hover:text-text-primary"
            >
              <cmn-icon [name]="newChatIcon" size="sm" />
            </button>
            <button
              (click)="toggle()"
              type="button"
              aria-label="Close chat"
              class="rounded-cmn-md p-cmn-1 text-text-secondary hover:bg-surface-hover hover:text-text-primary"
            >
              <cmn-icon [name]="closeIcon" size="sm" />
            </button>
          </div>
        </header>

        <div #scrollContainer class="flex-1 overflow-y-auto p-cmn-3">
          @if (store.hasMessages()) {
            <div class="flex flex-col gap-cmn-4">
              @for (message of store.messages(); track message.id) {
                <cmn-chat-message
                  [role]="message.role"
                  [text]="message.text"
                  [streaming]="message.streaming"
                  [tools]="message.tools"
                />
              }
            </div>
          } @else {
            <cmn-empty-state
              [icon]="emptyIcon"
              variant="bare"
              message="Ask Ledger"
              subMessage="Your finance agent, grounded in your real book."
            />
          }
        </div>

        @if (store.hasError()) {
          <cmn-alert variant="error" class="mx-cmn-3 mb-cmn-2">{{
            store.errorMessage()
          }}</cmn-alert>
        }

        <div class="border-t border-border-default p-cmn-3">
          <cmn-chat-input [loading]="store.isStreaming()" (send)="onSend($event)" />
        </div>
      </section>
    }

    <button
      [attr.aria-label]="isOpen() ? 'Close Ledger chat' : 'Open Ledger chat'"
      (click)="toggle()"
      type="button"
      class="flex h-14 w-14 items-center justify-center rounded-full bg-accent-default text-text-inverse shadow-lg transition-colors hover:bg-accent-hover focus:outline-none focus:ring-2 focus:ring-border-focus focus:ring-offset-2"
    >
      <cmn-icon [name]="isOpen() ? closeIcon : openIcon" size="md" />
    </button>
  </div>
}
